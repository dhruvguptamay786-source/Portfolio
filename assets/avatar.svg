<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background Circle with Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="avatarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Outer Glow Ring -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="url(#bgGrad)" stroke-width="4" stroke-dasharray="8 4" opacity="0.8"/>

  <!-- Main Background Container -->
  <circle cx="100" cy="100" r="88" fill="url(#avatarGlow)"/>

  <!-- Code Symbols Decorative Background -->
  <text x="35" y="65" fill="#06b6d4" opacity="0.3" font-family="monospace" font-size="16">&lt;/&gt;</text>
  <text x="145" y="75" fill="#6366f1" opacity="0.3" font-family="monospace" font-size="16">{;}</text>
  <text x="30" y="140" fill="#3b82f6" opacity="0.3" font-family="monospace" font-size="14">C++</text>
  <text x="145" y="145" fill="#06b6d4" opacity="0.3" font-family="monospace" font-size="14">JS</text>

  <!-- Developer Head Silhouette / Stylized Avatar -->
  <g fill="#f8fafc">
    <!-- Head -->
    <circle cx="100" cy="82" r="32" fill="#f1f5f9"/>
    <!-- Modern Hair & Glasses -->
    <path d="M 68 80 C 68 55, 132 55, 132 80 C 132 62, 115 50, 100 50 C 85 50, 68 62, 68 80 Z" fill="#334155"/>
    <!-- Glasses -->
    <rect x="78" y="76" width="18" height="12" rx="3" fill="none" stroke="#06b6d4" stroke-width="2.5"/>
    <rect x="104" y="76" width="18" height="12" rx="3" fill="none" stroke="#06b6d4" stroke-width="2.5"/>
    <line x1="96" y1="82" x2="104" y2="82" stroke="#06b6d4" stroke-width="2.5"/>
    <!-- Smile -->
    <path d="M 92 98 Q 100 105 108 98" stroke="#334155" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Shoulders / Hoodie Body -->
    <path d="M 50 162 C 50 126, 74 120, 100 120 C 126 120, 150 126, 150 162 Z" fill="#1e293b"/>
    <!-- Hoodie V-Neck & Zipper -->
    <path d="M 88 120 L 100 142 L 112 120 Z" fill="#334155"/>
    <line x1="100" y1="142" x2="100" y2="162" stroke="#06b6d4" stroke-width="2"/>
  </g>

  <!-- Laptop / Desk Accent at bottom -->
  <path d="M 60 168 L 140 168 L 148 178 L 52 178 Z" fill="url(#bgGrad)" opacity="0.9"/>
  <line x1="90" y1="173" x2="110" y2="173" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
</svg>
